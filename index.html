<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    image-rendering:pixelated;
}

body{
    background:#000 url("bac12.png") repeat;
    background-size:96px;
    color:white;
    font-family:Verdana,Arial,sans-serif;
    overflow-x:hidden;
}

/* dark overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    pointer-events:none;
}

.wrapper{
    position:relative;
    z-index:2;
    width:900px;
    margin:25px auto;
    text-align:center;
}

/* logo */

.logo{
    font-size:58px;
    color:#00ff00;
    font-weight:bold;
    text-shadow:
        3px 3px #000,
        0 0 10px #00ff00;
    margin-bottom:10px;
}

/* marquee */

marquee{
    background:#000080;
    color:yellow;
    border:3px ridge silver;
    padding:6px;
    margin-bottom:15px;
    font-weight:bold;
}

/* navbar */

.navbar{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.navbar a{
    color:white;
    text-decoration:none;
    background:#111;
    border:3px outset gray;
    padding:8px 18px;
    font-weight:bold;
}

.navbar a:hover{
    border-style:inset;
    background:#222;
    color:#00ff00;
}

/* content */

.window{
    background:#101010;
    border:4px ridge silver;
    padding:20px;
}

.window h2{
    color:#ff4444;
    margin-bottom:15px;
}

.window p{
    line-height:1.6;
    margin:10px 0;
}

.counter{
    display:inline-block;
    margin-top:20px;
    padding:6px 15px;
    background:black;
    border:3px inset gray;
    color:lime;
    font-family:monospace;
    font-size:20px;
}

.blink{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* floating junk */

.box{
    position:fixed;
    width:18px;
    height:18px;
    background:#00ff00;
    opacity:.15;
}

.b1{left:8%;top:15%;}
.b2{left:90%;top:25%;}
.b3{left:15%;bottom:10%;}
.b4{right:12%;bottom:20%;}
.b5{left:50%;top:8%;}

.footer{
    margin-top:25px;
    color:#999;
    font-size:13px;
}

</style>
</head>
<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="box b1"></div>
<div class="box b2"></div>
<div class="box b3"></div>
<div class="box b4"></div>
<div class="box b5"></div>

<div class="wrapper">

<div class="logo">
GAMEFREE.WIN
</div>

<marquee scrollamount="6">
• LAST UPDATED 2003 •
</marquee>

<div class="navbar">
<a href="#">HOME</a>
<a href="#">DOWNLOADS</a>
<a href="#">SCREENSHOTS</a>
<a href="#">LINKS</a>
<a href="#">CONTACT</a>
</div>

<div class="window">

<h2 class="blink">
UNDER CONSTRUCTION
</h2>

<p>
Welcome to GAMEFREE.WIN!
</p>

<p>

</p>

<p>
Please check back later while the archive is still being built.
</p>

<img src="https://web.archive.org/web/20091027023433/http://hk.geocities.com/underconstruction1/underconstruction.gif" style="margin-top:20px">

<br>

<div class="counter">
Visitors: 00001337
</div>

</div>

<div class="footer">
© 2002-2006 GAMEFREE.WIN
</div>

</div>
</body>
</html>
