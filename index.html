<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
    image-rendering:pixelated;

    background:#000 url("bac12.png") repeat;
    background-size:96px;

    font-family:"Courier New",monospace;
    color:white;
}

/* fake stars */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(white 1px,transparent 1px);
    background-size:60px 60px;
    opacity:.08;
    pointer-events:none;
}

.wrapper{
    width:760px;
    margin:30px auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:54px;
    color:#00ff00;
    font-weight:bold;
    text-shadow:
        3px 3px #003300;
}

.tagline{
    color:yellow;
    font-size:18px;
}

.mainbox{

    background:#bdbdbd;

    border-top:3px solid white;
    border-left:3px solid white;
    border-right:3px solid #555;
    border-bottom:3px solid #555;

    color:black;

    padding:18px;
}

.section{
    background:white;
    border:2px inset #888;
    padding:12px;
    margin-bottom:16px;
}

.section h2{
    margin-bottom:8px;
    color:navy;
}

.links{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.links a{
    color:blue;
    text-decoration:underline;
}

.links a:hover{
    background:yellow;
}

.counter{
    text-align:center;
    font-size:22px;
    color:red;
    margin-top:20px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:white;
    font-size:13px;
}

hr{
    margin:15px 0;
}

.blink{
    animation:blink .8s infinite;
    color:red;
    font-weight:bold;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

marquee{
    color:cyan;
    font-weight:bold;
    margin:12px 0;
}

.button{
    display:inline-block;
    background:silver;
    color:black;
    padding:4px 10px;
    border-top:2px solid white;
    border-left:2px solid white;
    border-right:2px solid #555;
    border-bottom:2px solid #555;
    margin:4px;
    text-decoration:none;
}

.button:active{
    border-top:2px solid #555;
    border-left:2px solid #555;
    border-right:2px solid white;
    border-bottom:2px solid white;
}

.guestbook{
    text-align:center;
    margin-top:18px;
}

.small{
    font-size:12px;
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="wrapper">

<div class="header">
<div class="logo">GAMEFREE.WIN</div>
<div class="tagline">Welcome to our</div>
</div>

<div class="mainbox">

<div class="section">
<h2>Welcome!</h2>

<p>
Welcome to <b>GAMEFREE.WIN</b>!
This website is currently under construction.
</p>

<hr>

<center>
<span class="blink">🚧 UNDER CONSTRUCTION 🚧</span>
</center>

</div>

<div class="section">

<h2>Navigation</h2>

<div class="links">

<a href="#">Games</a>
<a href="#">Downloads</a>

<a href="#">Guestbook</a>
<a href="#">Links</a>

<a href="#">About Us</a>
<a href="#">Contact</a>

</div>

</div>

<div class="guestbook">

<a class="button" href="#">Sign Guestbook</a>

<a class="button" href="#">View Guestbook</a>

<a class="button" href="#">Email Me</a>

</div>

<div class="counter">

Visitor #00001337

</div>

</div>

<div class="footer">

<p class="small">
© 1999-2026 GAMEFREE.WIN
</p>

<p class="small">
</p>

</div>

</div>

</body>
</html>
