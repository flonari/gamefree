<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    background-color: black;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* ── MAIN LAYOUT ── */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-image-wrap {
    position: relative;
    display: block;
    line-height: 0;
}

.main-image {
    display: block;
    max-width: 100%;
    height: auto;
}

.game-zone {
    position: absolute;
    left: 164px;
    top: 267px;
    width: 79px;
    height: 71px;
    cursor: pointer;
}

/* ── TASKBAR ── */
.taskbar {
    position: relative;
    width: 100%;
}

.taskbar img {
    width: 100%;
    display: block;
}

.click-zone {
    position: absolute;
    left: 19px;
    top: 10px;
    width: 69px;
    height: 28px;
    cursor: pointer;
}

.collection-zone {
    position: absolute;
    left: 124px;
    top: 11px;
    width: 105px;
    height: 25px;
    cursor: pointer;
}

.draws-zone {
    position: absolute;
    left: 265px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
}

.videos-zone {
    position: absolute;
    left: 400px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
    font-family: monospace;
    font-size: 9px;
    color: #6ed632;
    letter-spacing: 2px;
}

/* ── ABOUT (ONLY MODIFIED PART) ── */
.about {
    display: none;
    margin-top: 8px;
    width: 310px;

    background: linear-gradient(
        180deg,
        rgba(90,120,180,0.28),
        rgba(20,30,60,0.85),
        rgba(0,0,0,0.95)
    );

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;

    box-shadow:
        0 0 15px rgba(80,140,255,0.25),
        0 10px 30px rgba(0,0,0,0.7);

    font-family: Tahoma, sans-serif;
    color: #b7c5d8;

    position: relative;
    overflow: hidden;
    transform: rotate(-0.2deg);
}

/* scanline + grime */
.about::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.02) 0px,
            rgba(255,255,255,0.02) 1px,
            transparent 1px,
            transparent 3px
        );
    opacity: 0.6;
    pointer-events: none;
}

/* broken shine */
.about::after {
    content: '';
    position: absolute;
    top: -20%;
    left: -10%;
    width: 120%;
    height: 60%;
    background: linear-gradient(
        180deg,
        rgba(255,255,255,0.12),
        transparent
    );
    transform: rotate(-2deg);
    pointer-events: none;
}

.about-header {
    padding: 6px 10px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #d8e6ff;

    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.about-body {
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
}

/* ── VISIT COUNTER (RESTORED FULL) ── */
#visit-counter {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 10px 0 4px;
}

#vc-wrap {
    font-family: monospace;
    color: #888780;
    display: inline-flex;
    gap: 8px;
}

#vc-digits {
    display: flex;
    gap: 1px;
}

.vc-digit {
    font-size: 18px;
    width: 13px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* overlays */
#blackout {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
}

#fade-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99999;
    opacity: 0;
    transition: opacity 1.8s ease;
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<!-- VISIT COUNTER (RESTORED FUNCTIONALITY BELOW JS) -->
<div id="visit-counter">
    <div id="vc-wrap">
        <div id="vc-digits"></div>
    </div>
</div>

<div class="container">
    <div class="main-image-wrap">
        <img src="gamerfre.png">
        <div class="game-zone" onclick="playGameSound()"></div>
    </div>

    <div class="taskbar">
        <img src="takbasrceacsd.png">

        <div class="click-zone" onclick="toggleAbout()"></div>
        <div class="collection-zone" onclick="toggleCollection()"></div>
        <div class="draws-zone" onclick="goToDraws()"></div>
        <div class="videos-zone" onclick="goToVideos()"></div>
    </div>
</div>

<div class="about" id="about">
    <div class="about-header">AB0UT GAMEFREE.WIN</div>
    <div class="about-body">
        the gamefree website domain has been restored to its rightful owner on 04.14.<br>
        gamerfree.win is for everyone and everybody<br><br>
        you are welcome here.<br>
        play the games / watch the films<br>
        NNaNNaNNaNNaNNaNNaNNa<br>
        system stable
    </div>
</div>

<div id="fade-overlay"></div>
<div id="blackout"></div>

<script>
/* ── VISIT COUNTER (RESTORED FULL) ── */
(function () {
    var BASE = 1860, DIGITS = 3;

    function render() {
        var n = String(BASE).padStart(DIGITS, '0');
        var c = document.getElementById('vc-digits');
        c.innerHTML = '';

        for (var i = 0; i < n.length; i++) {
            var d = document.createElement('div');
            d.className = 'vc-digit';
            d.textContent = n[i];
            c.appendChild(d);
        }
    }

    render();
})();

/* ── BUTTON FIX FUNCTIONS (RESTORED STUBS IF YOU HAD THEM) ── */
function toggleAbout() {
    const about = document.getElementById("about");
    about.style.display = (about.style.display === "block") ? "none" : "block";
}

function toggleCollection() {
    window.location.href = "/discs";
}

function goToDraws() {
    window.location.href = "/draws";
}

function goToVideos() {
    window.location.href = "/videos";
}

/* ── GAME CLICK (SAFE VERSION) ── */
function playGameSound() {
    if (gameCooldown) return;
    if (currentGameAudio && !currentGameAudio.ended) return;

    gameCooldown = true;
    setTimeout(() => gameCooldown = false, 600); // cooldown restored

    const zone = document.querySelector(".game-zone");

    // 1/100 glitch chance restored
    if (Math.random() < 0.01) {
        triggerGlitch();
        return;
    }

    const pool = [1, 2, 4, 5, 6, 7];
    const track = pool[Math.floor(Math.random() * pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();

    zone.style.cursor = "default";

    currentGameAudio.addEventListener("ended", function () {
        zone.style.cursor = "pointer";
    });
}
</script>

</body>
</html>
