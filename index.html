<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;

    /* Tiled background */
    background-color:#000;
    background-image:url("bac12.png");
    background-repeat:repeat;
    background-size:128px 128px;
    image-rendering:pixelated;
    font-family:Arial, sans-serif;
}

.main-image-wrap{
    position:relative;
    display:block;
    line-height:0;
    z-index:2;
}

.main-image{
    display:block;
    max-width:100%;
    height:auto;
}

.game-zone{
    position:absolute;
    left:164px;
    top:267px;
    width:79px;
    height:71px;
    cursor:pointer;
}

/* Construction notice */
.notice{
    margin-top:30px;
    padding:14px 30px;
    border:2px solid #ffffff;
    background:rgba(0,0,0,.8);
    color:#fff;
    font-size:30px;
    font-weight:bold;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #ffffff;
    box-shadow:
        0 0 15px rgba(255,255,255,.25),
        inset 0 0 10px rgba(255,255,255,.08);
    z-index:2;
}

/* Dark overlay to make the background less distracting */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    pointer-events:none;
    z-index:1;
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="main-image-wrap">
    <img src="syst.png" class="main-image" alt="main image">
    <div class="game-zone" onclick="playGameSound()"></div>
</div>

<div class="notice">
    🚧 UNDER CONSTRUCTION 🚧
</div>

<script>
let currentGameAudio = null;

function playGameSound() {
    if (currentGameAudio && !currentGameAudio.ended) return;

    const zone = document.querySelector(".game-zone");
    const pool = [1, 2, 4, 5, 6, 7];
    const track = pool[Math.floor(Math.random() * pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();

    zone.style.cursor = "default";

    currentGameAudio.addEventListener("ended", function () {
        zone.style.cursor = "pointer";
    });
}
</script>

</body>
</html>
