<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;

    background:#000;
    background-image:url("bac12.png");
    background-repeat:repeat;

    /* 25% smaller tiles (128 -> 96) */
    background-size:96px 96px;

    image-rendering:pixelated;
    font-family:Arial, sans-serif;
}

/* Slight dark overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.32);
    pointer-events:none;
    z-index:1;
}

.main-image-wrap{
    position:relative;
    display:block;
    line-height:0;
    z-index:2;
}

.main-image{
    display:block;
    max-width:100%;
    height:auto;
}

/* Audio hotspot */
.game-zone{
    position:absolute;
    left:170px;
    top:144px;
    width:72px;
    height:81px;
    cursor:pointer;
}

/* Retro construction sign */
.notice{
    margin-top:18px;
    padding:8px 18px;

    background:#111;
    color:#d7d7d7;

    border:3px solid #bfbfbf;
    outline:2px solid #444;
    outline-offset:-5px;

    font-family:"Courier New", monospace;
    font-size:22px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:2px;
    line-height:1.4;
    text-align:center;

    box-shadow:
        4px 4px 0 #000;

    transform:rotate(-0.8deg);
    animation:shake .18s infinite steps(2);

    image-rendering:pixelated;
    z-index:2;
}

@keyframes shake{
    0%{
        transform:translate(0,0) rotate(-0.8deg);
    }
    25%{
        transform:translate(-1px,1px) rotate(-1deg);
    }
    50%{
        transform:translate(1px,0) rotate(-0.5deg);
    }
    75%{
        transform:translate(0,-1px) rotate(-1.2deg);
    }
    100%{
        transform:translate(0,0) rotate(-0.8deg);
    }
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="main-image-wrap">
    <img src="syst.png" class="main-image" alt="main image">
    <div class="game-zone" onclick="playGameSound()"></div>
</div>

<div class="notice">
    [ UNDER CONSTRUCTION ]<br>
    PLEASE COME BACK LATER...
</div>

<script>
let currentGameAudio = null;

function playGameSound() {
    if (currentGameAudio && !currentGameAudio.ended) return;

    const zone = document.querySelector(".game-zone");
    const pool = [1, 2, 4, 5, 6, 7];
    const track = pool[Math.floor(Math.random() * pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();

    zone.style.cursor = "default";

    currentGameAudio.addEventListener("ended", function () {
        zone.style.cursor = "pointer";
    });
}
</script>

</body>
</html>
