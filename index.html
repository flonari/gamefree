<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;

    /* Tiled background */
    background-color:#000;
    background-image:url("bac12.png");
    background-repeat:repeat;
    background-size:128px 128px;

    image-rendering:pixelated;
    font-family:Arial,sans-serif;
}

/* Dark overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    pointer-events:none;
    z-index:1;
}

.main-image-wrap{
    position:relative;
    display:block;
    line-height:0;
    z-index:2;
}

.main-image{
    display:block;
    max-width:100%;
    height:auto;
}

/* Audio click area */
.game-zone{
    position:absolute;

    /* New position */
    left:170px;
    top:144px;

    /* New size */
    width:72px;
    height:81px;

    cursor:pointer;
}

.notice{
    z-index:2;
}

</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="main-image-wrap">
    <img src="syst.png" class="main-image" alt="main image">

    <div class="game-zone" onclick="playGameSound()"></div>
</div>
<p style="color:white;">under construction</p>
<div class="notice"></div>

<script>
let currentGameAudio = null;

function playGameSound() {
    if (currentGameAudio && !currentGameAudio.ended) return;

    const zone = document.querySelector(".game-zone");

    const pool = [1, 2, 4, 5, 6, 7];
    const track = pool[Math.floor(Math.random() * pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();

    zone.style.cursor = "default";

    currentGameAudio.addEventListener("ended", function () {
        zone.style.cursor = "pointer";
    });
}
</script>

</body>
</html>
