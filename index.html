<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T-MINUS // DO NOT CLOSE</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
:root{
    --void:#050202;
    --blood:#7a0000;
    --alarm:#ff1a1a;
    --amber:#ff6a00;
    --ash:#c9bcbc;
    --dim:#2a0a0a;
}
html,body{
    height:100%;
    background:var(--void);
    overflow:hidden;
}
body{
    font-family:"Courier New",monospace;
    color:var(--ash);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:default;
}

/* hazard stripe bars top & bottom */
.hazard{
    position:fixed;
    left:0;
    right:0;
    height:14px;
    background:repeating-linear-gradient(45deg,var(--amber) 0 14px,#000 14px 28px);
    z-index:20;
    opacity:.85;
}
.hazard.top{top:0;}
.hazard.bottom{bottom:0;}

/* scanlines + vignette */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0px,rgba(255,255,255,.025) 1px,transparent 1px,transparent 3px);
    pointer-events:none;
    z-index:15;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(80,0,0,.55) 100%);
    pointer-events:none;
    z-index:14;
    animation:pulseVignette 6s ease-in-out infinite;
}
@keyframes pulseVignette{
    0%,100%{opacity:.4;}
    50%{opacity:.55;}
}

/* static noise flashes */
.noise{
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity:0;
    pointer-events:none;
    z-index:16;
    mix-blend-mode:overlay;
}
.noise.flash{
    animation:noiseFlash .15s steps(2) 1;
}
@keyframes noiseFlash{
    0%{opacity:0;}
    30%{opacity:.22;}
    60%{opacity:.05;}
    100%{opacity:0;}
}

h1{
    position:fixed;
    top:24%;
    left:50%;
    transform:translateX(-50%);
    font-size:15px;
    letter-spacing:3px;
    text-align:center;
    color:var(--ash);
    max-width:600px;
    width:90%;
    line-height:1.8;
    text-shadow:1px 1px 0 #000;
    z-index:10;
}
h1 span{
    color:var(--alarm);
    font-weight:bold;
}

.clock{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:14px;
    z-index:10;
}
.unit{
    background:linear-gradient(180deg,#150404,#0a0202);
    border:1px solid var(--blood);
    box-shadow:0 0 18px rgba(255,26,26,.25), inset 0 0 12px rgba(0,0,0,.8);
    padding:16px 14px;
    text-align:center;
    min-width:82px;
    position:relative;
}
.unit::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,transparent 49%,rgba(255,26,26,.06) 50%,transparent 51%);
}
.unit .num{
    font-size:44px;
    font-weight:bold;
    color:var(--alarm);
    text-shadow:0 0 10px rgba(255,26,26,.8), 0 0 30px rgba(255,26,26,.3);
    letter-spacing:1px;
    position:relative;
}
.unit .num.glitching{
    animation:glitchText .12s steps(2) 3;
}
@keyframes glitchText{
    0%{transform:translate(0,0); text-shadow:2px 0 var(--amber),-2px 0 #00eaff;}
    50%{transform:translate(-1px,1px); text-shadow:-2px 0 var(--amber),2px 0 #00eaff;}
    100%{transform:translate(0,0); text-shadow:0 0 10px rgba(255,26,26,.8);}
}
.unit .lbl{
    margin-top:8px;
    font-size:9px;
    letter-spacing:3px;
    color:#8a6a6a;
}

.target-date{
    position:fixed;
    top:63%;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:2px;
    color:#8a6a6a;
    z-index:10;
    text-align:center;
}
.target-date b{
    color:var(--ash);
}
</style>
</head>
<body>

<div class="hazard top"></div>
<div class="hazard bottom"></div>
<div class="noise" id="noise"></div>

<div class="clock" id="clock">
    <div class="unit"><div class="num" id="dd">00</div><div class="lbl">DAYS</div></div>
    <div class="unit"><div class="num" id="hh">00</div><div class="lbl">HRS</div></div>
    <div class="unit"><div class="num" id="mm">00</div><div class="lbl">MIN</div></div>
    <div class="unit"><div class="num" id="ss">00</div><div class="lbl">SEC</div></div>
</div>

<div class="target-date">TARGET LOCK: <b id="targetLabel">AUGUST 9</b></div>

<script>
(function(){
    function getTargetDate(){
        var now = new Date();
        var year = now.getFullYear();
        var target = new Date(year, 7, 9, 0, 0, 0); // August is month index 7
        if(target.getTime() <= now.getTime()){
            target = new Date(year + 1, 7, 9, 0, 0, 0);
        }
        return target;
    }

    var target = getTargetDate();
    var ddEl = document.getElementById('dd');
    var hhEl = document.getElementById('hh');
    var mmEl = document.getElementById('mm');
    var ssEl = document.getElementById('ss');
    var noise = document.getElementById('noise');

    function pad(n){ return String(n).padStart(2, '0'); }

    function render(){
        var now = new Date();
        var diff = Math.max(0, target.getTime() - now.getTime());

        var days = Math.floor(diff / (1000*60*60*24));
        var hours = Math.floor((diff / (1000*60*60)) % 24);
        var mins = Math.floor((diff / (1000*60)) % 60);
        var secs = Math.floor((diff / 1000) % 60);

        ddEl.textContent = pad(days);
        hhEl.textContent = pad(hours);
        mmEl.textContent = pad(mins);
        ssEl.textContent = pad(secs);
    }

    render();
    setInterval(render, 1000);

    // occasional digit glitch for unease
    function randomGlitch(){
        var units = document.querySelectorAll('.unit .num');
        var el = units[Math.floor(Math.random() * units.length)];
        el.classList.add('glitching');
        setTimeout(function(){ el.classList.remove('glitching'); }, 300);
        setTimeout(randomGlitch, 6000 + Math.random() * 8000);
    }
    setTimeout(randomGlitch, 5000);

    // occasional full-screen static flash
    function randomNoise(){
        noise.classList.remove('flash');
        void noise.offsetWidth; // restart animation
        noise.classList.add('flash');
        setTimeout(randomNoise, 12000 + Math.random() * 15000);
    }
    setTimeout(randomNoise, 9000);
})();
</script>

</body>
</html>
