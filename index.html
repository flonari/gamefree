<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    background: black;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* ── LAYOUT ── */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-image-wrap {
    position: relative;
}

.main-image {
    display: block;
    max-width: 100%;
}

/* CLICK ZONES */
.game-zone {
    position: absolute;
    left: 164px;
    top: 267px;
    width: 79px;
    height: 71px;
    cursor: pointer;
}

.taskbar {
    position: relative;
}

.taskbar img {
    width: 100%;
    display: block;
}

.click-zone {
    position: absolute;
    left: 19px;
    top: 10px;
    width: 69px;
    height: 28px;
    cursor: pointer;
}

.collection-zone {
    position: absolute;
    left: 124px;
    top: 11px;
    width: 105px;
    height: 25px;
    cursor: pointer;
}

.draws-zone {
    position: absolute;
    left: 265px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
}

.videos-zone {
    position: absolute;
    left: 400px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
    font-family: monospace;
    font-size: 9px;
    color: #6ed632;
}

/* ── ABOUT (scuffed but intact) ── */
.about {
    display: none;
    margin-top: 8px;
    width: 310px;

    background: linear-gradient(
        180deg,
        rgba(90,120,180,0.28),
        rgba(20,30,60,0.85),
        rgba(0,0,0,0.95)
    );

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;

    box-shadow: 0 0 15px rgba(80,140,255,0.25);

    font-family: Tahoma;
    color: #b7c5d8;

    position: relative;
}

.about-header {
    padding: 6px 10px;
    font-size: 9px;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.about-body {
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
}

/* ── VISIT COUNTER ── */
#visit-counter {
    padding: 10px;
    font-family: monospace;
    color: #888;
}

/* overlays */
#blackout, #fade-overlay {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
}
#fade-overlay {
    opacity: 0;
    transition: opacity 1.8s ease;
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<!-- VISIT COUNTER -->
<div id="visit-counter">
    <div id="vc-digits"></div>
</div>

<div class="container">

    <div class="main-image-wrap">
        <img src="gamerfre.png">

        <div class="game-zone" onclick="playGameSound()"></div>
    </div>

    <div class="taskbar">
        <img src="takbasrceacsd.png">

        <div class="click-zone" onclick="toggleAbout(); playClickSound();"></div>
        <div class="collection-zone" onclick="go('/discs'); playClickSound();"></div>
        <div class="draws-zone" onclick="goDraws(); playClickSound();"></div>
        <div class="videos-zone" onclick="goVideos(); playClickSound();">VID</div>
    </div>
</div>

<!-- ABOUT -->
<div class="about" id="about">
    <div class="about-header">AB0UT GAMEFREE.WIN</div>
    <div class="about-body">
        the domain has been restored to its owner<br>
        gamerfree.win is for everyone<br><br>
        you are welcome here<br>
        play / watch / explore<br>
        NNaNNaNNaNNaNNaNNa<br>
        system stable
    </div>
</div>

<div id="fade-overlay"></div>
<div id="blackout"></div>

<script>

/* ── VISIT COUNTER ── */
(function () {
    const el = document.getElementById("vc-digits");
    const base = 1860;

    el.textContent = base;
})();

/* ── CLICK SOUND (WITH COOLDOWN) ── */
let lastClick = 0;
function playClickSound() {
    const now = Date.now();
    if (now - lastClick < 250) return; // cooldown
    lastClick = now;

    const file = Math.random() < 0.5 ? "c1.ogg" : "c2.ogg";
    new Audio(file).play();
}

/* ── GAME CLICK (1/100 GLITCH CHANCE RESTORED) ── */
let currentGameAudio = null;

function playGameSound() {
    if (currentGameAudio && !currentGameAudio.ended) return;

    // 1/100 glitch trigger
    if (Math.floor(Math.random() * 100) === 0) {
        triggerGlitch();
        return;
    }

    const pool = [1,2,4,5,6,7];
    const track = pool[Math.floor(Math.random() * pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();
}

/* ── GLITCH (simple safe version placeholder) ── */
function triggerGlitch() {
    const audio = new Audio("game3.ogg");
    audio.play();

    document.body.style.filter = "contrast(2) hue-rotate(90deg)";
    setTimeout(() => {
        document.body.style.filter = "";
    }, 2000);
}

/* ── NAV ── */
function go(url) {
    window.location.href = url;
}
function goDraws() {
    window.location.href = "/draws";
}
function goVideos() {
    window.location.href = "/videos";
}
function toggleAbout() {
    const a = document.getElementById("about");
    a.style.display = (a.style.display === "block") ? "none" : "block";
}

</script>

</body>
</html>
