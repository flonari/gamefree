<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GAMEFREE.WIN</title>

<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    background-color: black;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* ── LAYOUT ── */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.main-image-wrap {
    position: relative;
}

.main-image {
    display: block;
    max-width: 100%;
}

/* CLICK ZONES */
.game-zone {
    position: absolute;
    left: 164px;
    top: 267px;
    width: 79px;
    height: 71px;
    cursor: pointer;
}

.taskbar {
    position: relative;
    width: 100%;
}

.taskbar img {
    width: 100%;
    display: block;
}

.click-zone {
    position: absolute;
    left: 19px;
    top: 10px;
    width: 69px;
    height: 28px;
    cursor: pointer;
}

.collection-zone {
    position: absolute;
    left: 124px;
    top: 11px;
    width: 105px;
    height: 25px;
    cursor: pointer;
}

.draws-zone {
    position: absolute;
    left: 265px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
}

.videos-zone {
    position: absolute;
    left: 400px;
    top: 9px;
    width: 75px;
    height: 31px;
    cursor: pointer;
    font-family: monospace;
    font-size: 9px;
    color: #6ed632;
}

/* ── ABOUT (SCUFFED + BROKEN) ── */
.about {
    display: none;
    margin-top: 6px;
    width: 304px;

    background: linear-gradient(
        180deg,
        rgba(90,120,180,0.28),
        rgba(10,10,20,0.95)
    );

    border-top: 1px solid rgba(255,255,255,0.18);
    border-left: 1px solid rgba(255,255,255,0.07);
    border-right: 1px solid rgba(0,0,0,0.9);
    border-bottom: 1px solid black;

    border-radius: 8px 13px 5px 10px;

    box-shadow: 0 0 18px rgba(80,120,255,0.15);

    font-family: Tahoma;
    color: #aebfd3;

    transform: rotate(-0.35deg);
    animation: drift 3s infinite steps(2);

    position: relative;
    overflow: hidden;
}

/* scanline corruption */
.about::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.02) 0px,
        transparent 2px,
        transparent 4px
    );
    opacity: 0.6;
    pointer-events: none;
}

.about-header {
    padding: 5px 9px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #d8e6ff;
    background: rgba(20,40,90,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.about-body {
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
}

@keyframes drift {
    0% { transform: translate(0,0); }
    50% { transform: translate(0.5px,-0.4px); }
    100% { transform: translate(0,0); }
}

/* overlays */
#blackout {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
}

#fade-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99999;
    opacity: 0;
    transition: opacity 1.8s ease;
}
</style>
</head>

<body>

<audio src="ambient2.ogg" autoplay loop></audio>

<div class="container">
    <div class="main-image-wrap">
        <img src="gamerfre.png">
        <div class="game-zone" onclick="playGameSound()"></div>
    </div>

    <div class="taskbar">
        <img src="takbasrceacsd.png">

        <div class="click-zone" onclick="toggleAbout()"></div>
        <div class="collection-zone" onclick="toggleCollection()"></div>
        <div class="draws-zone" onclick="goToDraws()"></div>
        <div class="videos-zone" onclick="goToVideos()">VID</div>
    </div>
</div>

<div class="about" id="about">
    <div class="about-header">AB0UT__GAMEFREE//WIN</div>
    <div class="about-body">
        the domain was restored on 04.14<br>
        gamerfree.win is for every0ne<br><br>
        y0u are welc0me here.<br>
        play / watch / break things<br>
        NNaNNaNNaNNaNNa<br>
        ERR://buffer overflow
    </div>
</div>

<div id="fade-overlay"></div>
<div id="blackout"></div>

<script>
let currentGameAudio = null;

/* ── GAME SOUND ── */
function playGameSound() {
    if (currentGameAudio && !currentGameAudio.ended) return;

    const pool = [1,2,4,5,6,7];
    const track = pool[Math.floor(Math.random()*pool.length)];

    currentGameAudio = new Audio("game" + track + ".ogg");
    currentGameAudio.play();
}

/* ── CLICK SOUND ── */
function playClickSound() {
    new Audio(Math.random() < 0.5 ? "c1.ogg" : "c2.ogg").play();
}

/* ── ABOUT ── */
function toggleAbout() {
    playClickSound();
    const a = document.getElementById("about");
    a.style.display = (a.style.display === "block") ? "none" : "block";
}

/* ── NAVIGATION ── */
function toggleCollection() {
    playClickSound();
    window.location.href = "/discs";
}

function goToDraws() {
    const overlay = document.getElementById("fade-overlay");
    overlay.style.display = "block";
    requestAnimationFrame(()=>overlay.style.opacity="1");

    setTimeout(()=>window.location.href="/draws", 2000);
}

function goToVideos() {
    const blackout = document.getElementById("blackout");
    blackout.style.display = "block";

    setTimeout(()=>window.location.href="/videos", 1200);
}

/* glitch trigger (Tab optional) */
document.addEventListener("keydown", (e)=>{
    if(e.key === "Tab") {
        e.preventDefault();
        new Audio("game3.ogg").play();
    }
});
</script>

</body>
</html>
