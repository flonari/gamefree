<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #d0d0d0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    /* Outer gray frame */
    .frame {
      background-color: #b8b8b8;
      border: 3px solid #999;
      padding: 20px;
      box-shadow: none;
      width: fit-content;
    }
    /* Top bar */
    .top-bar {
      width: 650px;
      background-color: #b8b8b8;
      text-align: center;
      padding: 8px 0 14px 0;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #222;
    }
    /* Image area */
    .image-container {
      width: 650px;
      border: 2px solid #888;
      display: block;
      line-height: 0;
    }
    .image-container img {
      display: block;
      width: 650px;
      height: 450px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Caption / text area below image */
    .caption-area {
      width: 650px;
      background-color: #b8b8b8;
      padding: 14px 4px 4px 4px;
    }
    .caption-area .arrow-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-family: monospace;
      color: #0000cc;
      text-decoration: underline;
      cursor: pointer;
    }
    .caption-area .prompt {
      color: #333;
      font-family: monospace;
      font-size: 14px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top-bar">20.</div>
    <div class="image-container">
      <img src="uninterestingpatterns.png" width="650" height="450">
    </div>
    <div class="caption-area">
      <span class="prompt">You are the Everyman, and you have 20 pages to live.</span>
      <a class="arrow-link" href="#">Examine your surroundings.</a>
    </div>
  </div>
</body>
</html>
