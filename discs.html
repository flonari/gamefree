<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAZE — 1993 digitalized)</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.015) 2px, rgba(0,255,0,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,255,0,0.015) 2px, rgba(0,255,0,0.015) 4px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    color: #00ff41;
    gap: 18px;
  }

  h1 {
    font-size: 3rem;
    letter-spacing: 0.4em;
    text-shadow: 0 0 10px #00ff41;
  }

  #viewport-wrap {
    border: 2px solid #00ff41;
    width: 400px;
    height: 400px;
    position: relative;
    overflow: hidden;
  }

  canvas {
    width: 400px;
    height: 400px;
    image-rendering: pixelated;
    display: block;
  }

  #hud {
    font-family: monospace;
    font-size: 0.85rem;
    color: #00cc33;
    display: flex;
    gap: 20px;
  }

  #win-msg {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 10;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    flex-direction: column;
  }
</style>
</head>

<body>

<h1>◈ MAZE ◈</h1>

<div id="viewport-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="win-msg">
    YOU ESCAPED<br><small>PRESS R TO RESTART</small>
  </div>
</div>

<div id="hud">
  <span>POS: <span id="hud-pos"></span></span>
  <span>DIR: <span id="hud-dir"></span></span>
  <span>STEPS: <span id="hud-steps"></span></span>
</div>

<script>
// ── MAP ─────────────────────────────
const MAP_W = 16, MAP_H = 16;
const RAW = [
"1111111111111111",
"1000000000000001",
"1011111011110101",
"1010001010000101",
"1010101110111101",
"1000101000100001",
"1110101110101111",
"1000000010100001",
"1011110010111101",
"1010000010000101",
"1010111011011101",
"1010100000010001",
"1011101111010111",
"1000001000010001",
"1011110111111001",
"1111111111111101"
];

const map = RAW.map(r => r.split(''));
map[15][14] = 'E';

const isWall = (x,y)=> {
  x|=0; y|=0;
  return x<0||y<0||x>=MAP_W||y>=MAP_H||map[y][x]==='1';
};
const isExit = (x,y)=> map[y|0][x|0]==='E';

// ── PLAYER ───────────────────────────
let px=1.5, py=1.5, pa=0, steps=0, won=false;

// ── CANVAS ───────────────────────────
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const W=400,H=400;
const HALF=H/2;
const FOV=Math.PI/3;
const RAYS=200; // safe balance
const MAX=16;

const MOVE=0.07;
const ROT=0.06;

// ── INPUT ────────────────────────────
const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=1;
  if(e.code==="KeyR") restart();
});
addEventListener("keyup",e=>keys[e.code]=0);

function restart(){
  px=1.5;py=1.5;pa=0;steps=0;won=0;
  document.getElementById("win-msg").style.display="none";
}

// ── TEXTURE ──────────────────────────
const wallImg = new Image();
wallImg.src = "geasd.png";

let texReady = false;
wallImg.onload = ()=> texReady = true;

// ── RAYCAST ──────────────────────────
function cast(angle){
  const cos=Math.cos(angle), sin=Math.sin(angle);
  let mapX=px|0, mapY=py|0;

  const dX=Math.abs(1/cos);
  const dY=Math.abs(1/sin);

  const stepX=cos<0?-1:1;
  const stepY=sin<0?-1:1;

  let sX=cos<0?(px-mapX)*dX:(mapX+1-px)*dX;
  let sY=sin<0?(py-mapY)*dY:(mapY+1-py)*dY;

  let side=0, dist=0;

  for(let i=0;i<MAX*4;i++){
    if(sX<sY){ sX+=dX; mapX+=stepX; side=0; }
    else { sY+=dY; mapY+=stepY; side=1; }

    if(isWall(mapX,mapY)){
      dist = side? sY-dY : sX-dX;
      break;
    }
  }

  return {dist:dist||0.01, side};
}

// ── RENDER (TEXTURED BUT FAST) ───────
function render(){

  // sky + floor
  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,W,HALF);
  ctx.fillStyle="#111";
  ctx.fillRect(0,HALF,W,HALF);

  const colW = W / RAYS;

  for(let x=0;x<RAYS;x++){

    const rayA = pa - FOV/2 + (x/RAYS)*FOV;
    const {dist, side} = cast(rayA);

    const corr = dist * Math.cos(rayA-pa);
    const h = Math.min(H, H / corr);

    const y = (H - h) / 2;

    // ── TEXTURE MAPPING (FAST SLICE DRAW) ──
    if(texReady){

      // where on wall we hit (fake UV)
      const wallX = (px + Math.cos(rayA)*dist) % 1;

      const sx = Math.floor(wallX * wallImg.width);
      const sw = 1;

      const shade = Math.max(0.3, 1 - corr/10);
      ctx.globalAlpha = side ? shade*0.7 : shade;

      ctx.drawImage(
        wallImg,
        sx, 0, 1, wallImg.height,
        x * colW, y,
        colW + 1,
        h
      );

      ctx.globalAlpha = 1;

    } else {
      // fallback color
      const shade = Math.max(0, 255 - corr*25);
      ctx.fillStyle = `rgb(${shade},${shade*0.8},${shade*0.6})`;
      ctx.fillRect(x*colW, y, colW+1, h);
    }
  }
}

// ── LOOP ─────────────────────────────
let last=0;
function loop(t=0){
  requestAnimationFrame(loop);

  const dt=(t-last)/16; last=t;

  const ms=MOVE*dt;
  const rs=ROT*dt;

  if(keys.ArrowLeft)pa-=rs;
  if(keys.ArrowRight)pa+=rs;

  if(keys.ArrowUp){
    let nx=px+Math.cos(pa)*ms;
    let ny=py+Math.sin(pa)*ms;
    if(!isWall(nx,py))px=nx;
    if(!isWall(px,ny))py=ny;
    steps++;
  }

  if(keys.ArrowDown){
    let nx=px-Math.cos(pa)*ms;
    let ny=py-Math.sin(pa)*ms;
    if(!isWall(nx,py))px=nx;
    if(!isWall(px,ny))py=ny;
    steps++;
  }

  if(isExit(px,py)){
    won=1;
    document.getElementById("win-msg").style.display="flex";
  }

  render();

  const dirs=["E","SE","S","SW","W","NW","N","NE"];
  const di=((pa/(Math.PI*2))*8+8)|0;

  document.getElementById("hud-pos").textContent=`${px|0},${py|0}`;
  document.getElementById("hud-dir").textContent=dirs[di%8];
  document.getElementById("hud-steps").textContent=steps;
}

loop();
</script>
</body>
</html>
